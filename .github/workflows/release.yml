# Release prebuilt jev-cli binaries for Linux, Windows, and macOS.
# Tag a commit v* (or dispatch with a tag name) and the workflow builds
# release binaries per target, hashes them, and attaches everything to a
# GitHub release. No third-party release action: artifacts go up with the
# runner's own `gh` CLI.

name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary (tar)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          out="jev-cli-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/jev-cli" "dist/$out"
          strip "dist/$out" || true
          tar -C dist -czf "dist/$out.tar.gz" "$out"
      - name: Package binary (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $out = "jev-cli-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jev-cli.exe" "dist/$out.exe"
          Compress-Archive -Path "dist/$out.exe" -DestinationPath "dist/$out.zip" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jev-cli-${{ matrix.target }}
          path: dist/*
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          [ -n "$tag" ] || tag="${{ inputs.tag }}"
          cd dist
          sha256sum * > checksums.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber ./*
          else
            gh release create "$tag" --title "$tag" --generate-notes ./*
          fi
